<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1d6fb8" />
  <title>Phrasal Verbs — English for Bengalis</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;700&family=Noto+Sans+Bengali:wght@400;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/learning.css" />
</head>
<body data-root="..">
  <header class="site-header" id="site-header"></header>
  <div class="nav-drawer" id="nav-drawer"></div>
  <main class="wrap">
    <nav class="breadcrumb"><a href="../index.html">Home</a> › <a href="learn.html">Learn</a> › <span>Phrasal Verbs</span></nav>
    <h1 class="page-title">Phrasal Verbs</h1>
    <p class="page-intro bn">দৈনন্দিন কথায় বহুল ব্যবহৃত ফ্রেজাল ভার্ব — পড়ে Quiz দিন।</p>
    <div class="stack-actions" style="margin-bottom:1rem">
      <a class="btn btn-primary" href="quizzes.html?skill=phrasal">Phrasal Quiz</a>
      <a class="btn btn-secondary" href="flashcards.html?skill=phrasal">Flashcards</a>
    </div>
    <div id="list" class="lesson-block"></div>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="../js/storage.js"></script>
  <script src="../js/progress.js"></script>
  <script src="../js/app.js"></script>
  <script>
    EFBApp.loadJSON("phrasal-verbs.json").then((items) => {
      const list = document.getElementById("list");
      list.innerHTML = items.map((p) => `<article class="panel" data-item-id="${p.id}">
          <div class="quiz-meta"><strong style="font-size:1.2rem">${p.phrase}</strong><span class="chip">${p.cefr_level}</span></div>
          <p>${p.meaning_en} · <span class="bn">${p.meaning_bn}</span></p>
          <div class="example">${p.example}<br><span class="bn muted">${p.example_bn || ""}</span></div>
        </article>`).join("");
      EFBApp.watchLessonSeen(list);
      EFBProgress.setLastLesson("phrasal", "phrasal-list");
    });
  </script>
</body>
</html>
