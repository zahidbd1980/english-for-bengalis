<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f6b5c" />
  <title>Spoken English — English for Bengalis</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;700&family=Noto+Sans+Bengali:wght@400;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/learning.css" />
</head>
<body data-root="..">
  <header class="site-header" id="site-header"></header>
  <div class="nav-drawer" id="nav-drawer"></div>
  <main class="wrap">
    <nav class="breadcrumb"><a href="../index.html">Home</a> › <a href="learn.html">Learn</a> › <span>Spoken</span></nav>
    <h1 class="page-title">Spoken English · কথ্য ইংরেজি</h1>
    <p class="page-intro bn">ডায়ালগ পড়ুন, জোরে বলুন, পরে Translation Lab-এ অনুবাদ অনুশীলন করুন।</p>
    <div id="list" class="lesson-block"></div>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="../js/storage.js"></script>
  <script src="../js/progress.js"></script>
  <script src="../js/app.js"></script>
  <script>
    EFBApp.loadJSON("spoken.json").then((items) => {
      document.getElementById("list").innerHTML = items.map((d) => {
        EFBProgress.markSeen(d.id);
        return `<article class="panel">
          <div class="quiz-meta"><h2 style="margin:0;font-size:1.2rem">${d.title}</h2><span class="chip">${d.level}</span></div>
          ${(d.lines || []).map((l) => `<div class="example"><strong>${l.en}</strong><br><span class="bn muted">${l.bn}</span></div>`).join("")}
        </article>`;
      }).join("");
    });
  </script>
</body>
</html>
