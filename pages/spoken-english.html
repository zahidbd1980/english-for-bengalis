<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#217a66" />
  <title>Spoken English — English for Bengalis</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;700&family=Noto+Sans+Bengali:wght@400;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/learning.css" />
</head>
<body data-root="..">
  <header class="site-header" id="site-header"></header>
  <div class="nav-drawer" id="nav-drawer"></div>
  <main class="wrap">
    <nav class="breadcrumb"><a href="../index.html">Home</a> › <a href="learn.html">Learn</a> › <span>Spoken</span></nav>
    <h1 class="page-title">Spoken English · কথ্য ইংরেজি</h1>
    <p class="page-intro bn">ডায়লগ পড়ুন, তারপর Drill করে বাংলা দেখে ইংরেজি লাইন লিখুন।</p>
    <div class="stack-actions" style="margin-bottom:1rem">
      <a class="btn btn-primary" href="spoken-drill.html">Spoken Drill · অনুশীলন</a>
      <a class="btn btn-secondary" href="translation-lab.html">Translation Lab</a>
      <a class="btn btn-secondary" href="sentence-builder.html">Sentence Builder</a>
    </div>
    <div id="list" class="lesson-block"></div>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="../js/storage.js"></script>
  <script src="../js/progress.js"></script>
  <script src="../js/app.js"></script>
  <script>
    EFBApp.loadJSON("spoken.json").then((items) => {
      const list = document.getElementById("list");
      list.innerHTML = items.map((d) => {
        const level = d.level || d.cefr || "";
        const title = d.title_bn ? `${d.title} · ${d.title_bn}` : d.title;
        return `<article class="panel" data-item-id="${d.id}">
          <div class="quiz-meta"><h2 class="study-word-list">${title}</h2><span class="chip">${level}</span></div>
          ${(d.lines || []).map((l) => `<div class="example"><strong>${l.speaker ? l.speaker + ": " : ""}${l.en}</strong><br><span class="bn muted">${l.bn || ""}</span></div>`).join("")}
          <div class="stack-actions" style="margin-top:0.75rem">
            <a class="btn btn-primary" href="spoken-drill.html?id=${encodeURIComponent(d.id)}">এই ডায়লগ Drill</a>
          </div>
        </article>`;
      }).join("");
      EFBApp.watchLessonSeen(list);
      EFBProgress.setLastLesson("spoken", "spoken-list");
    });
  </script>
</body>
</html>
