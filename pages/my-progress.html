<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f6b5c" />
  <title>My Progress — English for Bengalis</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;700&family=Noto+Sans+Bengali:wght@400;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/learning.css" />
</head>
<body data-root="..">
  <header class="site-header" id="site-header"></header>
  <div class="nav-drawer" id="nav-drawer"></div>
  <main class="wrap">
    <nav class="breadcrumb"><a href="../index.html">Home</a> › <span>My Progress</span></nav>
    <h1 class="page-title">আমার প্রোগ্রেস</h1>
    <p class="page-intro bn">কত শিখেছেন এক নজরে। ব্রাউজার ডেটা হারাতে পারে — নিয়মিত Export করুন।</p>
    <div id="dash" class="lesson-block"></div>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="../js/storage.js"></script>
  <script src="../js/progress.js"></script>
  <script src="../js/review-session.js"></script>
  <script src="../js/vocabulary.js"></script>
  <script src="../js/app.js"></script>
  <script>
    function pct(n, d) { return d ? Math.round((n / d) * 100) : 0; }
    function shortLabel(id) {
      return String(id || "").replace(/^(vocab|pv|spell|grammar|mistake|spoken|sb):/, "");
    }
    function statusOf(state, id) {
      const it = state.items[id];
      return it ? it.status || 0 : 0;
    }

    Promise.all([
      EFBApp.loadJSON("vocabulary.json"),
      EFBApp.loadJSON("phrasal-verbs.json"),
      EFBApp.loadJSON("spelling.json"),
      EFBApp.loadJSON("grammar.json"),
      EFBApp.loadJSON("common-mistakes.json"),
      EFBApp.loadJSON("spoken.json"),
      EFBApp.loadJSON("sentence-builder.json"),
      EFBApp.loadJSON("progress_id_migrate.json").catch(() => ({})),
    ]).then(([vocabRaw, pv, spell, grammar, mistakes, spoken, sentence, idMap]) => {
      if (idMap && EFBStorage.applyIdMap) EFBStorage.applyIdMap(idMap);
      const vocab = EFBVocab.asWords(vocabRaw);
      const state = EFBStorage.load();
      const due = EFBProgress.dueItems();
      const weak = EFBReview.weakAreas(5);
      const countMastered = (list) => list.filter((x) => statusOf(state, x.id) === 5).length;
      const countStarted = (list) => list.filter((x) => statusOf(state, x.id) > 0).length;
      const countPracticed = (list) => list.filter((x) => statusOf(state, x.id) >= 3).length;

      const vocabTarget = Number(state.settings.vocab_target) || 2000;
      const vocabStarted = countStarted(vocab);
      const vocabMastered = countMastered(vocab);
      const vocabPracticed = countPracticed(vocab);
      const cont = EFBApp.resolveContinue ? EFBApp.resolveContinue(state) : null;

      const rows = [
        { name: "Vocabulary", started: vocabStarted, practiced: vocabPracticed, mastered: vocabMastered, total: vocab.length },
        { name: "Phrasal Verbs", started: countStarted(pv), practiced: countPracticed(pv), mastered: countMastered(pv), total: pv.length },
        { name: "Spelling", started: countStarted(spell), practiced: countPracticed(spell), mastered: countMastered(spell), total: spell.length },
        { name: "Grammar", started: countStarted(grammar), practiced: countPracticed(grammar), mastered: countMastered(grammar), total: grammar.length },
        { name: "Common Mistakes", started: countStarted(mistakes), practiced: countPracticed(mistakes), mastered: countMastered(mistakes), total: mistakes.length },
        { name: "Spoken", started: countStarted(spoken), practiced: countPracticed(spoken), mastered: countMastered(spoken), total: spoken.length },
        { name: "Sentence Builder", started: countStarted(sentence), practiced: countPracticed(sentence), mastered: countMastered(sentence), total: sentence.length },
      ];

      document.getElementById("dash").innerHTML = `
        <div class="panel highlight">
          <p class="chip">Vocabulary goal</p>
          <p class="bn" style="font-size:1.15rem;margin:0.35rem 0">
            শিখেছেন <strong>${vocabStarted}</strong> · অনুশীলন <strong>${vocabPracticed}</strong> · মাস্টার্ড <strong>${vocabMastered}</strong>
          </p>
          <p class="muted bn">ব্যক্তিগত টার্গেট: <strong>${vocabStarted}</strong> / ${vocabTarget} (${pct(vocabStarted, vocabTarget)}%)</p>
          <div class="bar" data-pct="${pct(vocabStarted, vocabTarget)}"><i></i></div>
          <p class="muted" style="margin-top:0.75rem">ব্যাংকে এখন ${vocab.length}টি শব্দ · বাকি টার্গেট Settings থেকে বদলাতে পারবেন</p>
          <div class="stack-actions">
            <a class="btn btn-primary" href="vocabulary.html">Vocabulary চালিয়ে যান</a>
            ${cont ? `<a class="btn btn-accent" href="${cont.href}">${cont.label}</a>` : ""}
            <a class="btn btn-secondary" href="settings.html">টার্গেট / Export</a>
            <a class="btn btn-ghost" href="daily-challenge.html">Daily Challenge</a>
            ${!state.profile.estimated_level ? `<a class="btn btn-ghost" href="level-test.html">Level Test</a>` : ""}
          </div>
        </div>
        <div class="panel">
          <p class="chip">Overview</p>
          <p class="bn">Estimated level: <strong>${state.profile.estimated_level || "এখনো টেস্ট হয়নি"}</strong></p>
          <p>Streak: <strong>${state.streak.current}</strong> (longest ${state.streak.longest}) · Goal: <strong>${state.settings.goal}</strong></p>
          <p class="muted">Daily challenge today: ${state.challenge.date === EFBProgress.todayStr() && state.challenge.completed ? "Completed ✔" : "Not completed yet"}</p>
        </div>
        <div class="panel">
          <h2 style="margin-top:0;font-family:var(--font-display)">Skill progress</h2>
          <p class="muted bn" style="margin-top:0">Started = দেখেছেন · Practiced = কুইজ/কার্ড করেছেন · Mastered = ভালোভাবে আয়ত্ত</p>
          <div class="stat-row">
            ${rows.map((r) => `
              <div class="stat">
                <div class="stat-top"><span>${r.name}</span><span>${r.started}/${r.total} started · ${r.mastered} mastered</span></div>
                <div class="bar" data-pct="${pct(r.started, r.total)}"><i></i></div>
                <p class="muted" style="margin:0.35rem 0 0;font-size:0.9rem">practiced ${r.practiced} · mastered ${r.mastered}/${r.total} (${pct(r.mastered, r.total)}%)</p>
              </div>`).join("")}
          </div>
        </div>
        <div class="panel">
          <h2 style="margin-top:0;font-family:var(--font-display)">Review due</h2>
          ${due.length ? `
            <p class="bn muted">${due.length}টি আইটেম আজ রিভিউর জন্য due।</p>
            <ul class="list-clean">${due.slice(0, 12).map((d) => `<li><code>${shortLabel(d.id)}</code></li>`).join("")}</ul>
            <a class="btn btn-primary" href="quizzes.html?mode=review">রিভিউ সেশন শুরু · Start review</a>
          ` : `<p class="empty-state bn">আজ রিভিউ নেই — নতুন লেসন করুন।</p>
            <a class="btn btn-primary" href="learn.html">শিখুন</a>`}
        </div>
        <div class="panel">
          <h2 style="margin-top:0;font-family:var(--font-display)">Mistake Bank</h2>
          ${state.mistakes.length ? `
            <p class="bn muted">${state.mistakes.length}টি ভুল জমা আছে — সঠিক উত্তর দিলে তালিকা থেকে সরবে।</p>
            <ul>${state.mistakes.slice(0, 15).map((m) => `<li><code>${shortLabel(m)}</code></li>`).join("")}</ul>
            <a class="btn btn-secondary" href="quizzes.html?mode=mistakes">Mistake Bank practice</a>
          ` : `<p class="muted bn">এখনো কোনো ভুল জমা হয়নি। কুইজ দিলে ভুলগুলো এখানে আসবে।</p>
            <a class="btn btn-ghost" href="quizzes.html">Quizzes খুলুন</a>`}
        </div>
        <div class="panel">
          <h2 style="margin-top:0;font-family:var(--font-display)">Weak areas</h2>
          ${weak.length ? `
            <ul class="list-clean">${weak.map((w) => `
              <li><code>${shortLabel(w.id)}</code>
                <span class="muted"> — wrong ${w.wrong_count} · mastery ${w.mastery_score}</span>
              </li>`).join("")}</ul>
            <a class="btn btn-ghost" href="quizzes.html?mode=review">দুর্বল অংশ রিভিউ</a>
          ` : `<p class="muted bn">এখনো যথেষ্ট ডেটা নেই — কয়েকটা কুইজ দিয়ে শুরু করুন।</p>`}
        </div>
      `;
      EFBApp.animateBars();
    });
  </script>
</body>
</html>
