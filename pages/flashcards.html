<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f6b5c" />
  <title>Flashcards — English for Bengalis</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;700&family=Noto+Sans+Bengali:wght@400;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/learning.css" />
</head>
<body data-root="..">
  <header class="site-header" id="site-header"></header>
  <div class="nav-drawer" id="nav-drawer"></div>
  <main class="wrap">
    <nav class="breadcrumb"><a href="../index.html">Home</a> › <a href="practice.html">Practice</a> › <span>Flashcards</span></nav>
    <h1 class="page-title">Flashcards</h1>
    <p class="page-intro bn">কার্ড ট্যাপ করে উল্টান। “জানি” বা “কঠিন” দিয়ে প্রোগ্রেস আপডেট হয়। ব্রাউজার বন্ধ করলেও একই কার্ড থেকে চলবে।</p>
    <div id="root"></div>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="../js/storage.js"></script>
  <script src="../js/progress.js"></script>
  <script src="../js/quiz-engine.js"></script>
  <script src="../js/daily-challenge.js"></script>
  <script src="../js/app.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const skill = params.get("skill") || "vocabulary";
    const fromFilter = params.get("from") === "filter";
    const fresh = params.get("restart") === "1";
    Promise.all([
      EFBApp.loadJSON("vocabulary.json"),
      EFBApp.loadJSON("phrasal-verbs.json"),
    ]).then(([vocabRaw, pv]) => {
      const vocab = Array.isArray(vocabRaw) ? vocabRaw : vocabRaw.words || [];
      let cards = [];
      if (fromFilter && skill === "vocabulary") {
        try {
          const raw =
            sessionStorage.getItem("efb_vocab_study_set") ||
            localStorage.getItem("efb_vocab_study_set_v1");
          if (raw) cards = JSON.parse(raw) || [];
        } catch (e) {}
        if (!cards.length) {
          const r = EFBProgress.getResume("flashcards");
          if (r && r.cards_lite && r.cards_lite.length) cards = r.cards_lite;
        }
      }
      if (!cards.length && skill === "phrasal") {
        cards = pv.map((p) => ({
          item_id: p.id,
          front: p.phrase,
          back: p.meaning_en,
          back_bn: p.meaning_bn,
          example: p.example,
        }));
      } else if (!cards.length) {
        cards = vocab.map((w) => ({
          item_id: w.id,
          front: w.word,
          back: w.meaning_en,
          back_bn: w.meaning_bn,
          example: w.example,
        }));
      }
      EFBFlashcards.mount(document.getElementById("root"), cards, {
        skill: skill,
        fromFilter: fromFilter,
        fresh: fresh,
        label: fromFilter ? "Flashcards · filtered" : "Flashcards · " + skill,
      });
    });
  </script>
</body>
</html>
