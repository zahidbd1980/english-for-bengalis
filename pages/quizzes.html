<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1d6fb8" />
  <title>Quizzes — English for Bengalis</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;700&family=Noto+Sans+Bengali:wght@400;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/learning.css" />
</head>
<body data-root="..">
  <header class="site-header" id="site-header"></header>
  <div class="nav-drawer" id="nav-drawer"></div>
  <main class="wrap">
    <nav class="breadcrumb"><a href="../index.html">Home</a> › <a href="practice.html">Practice</a> › <span>Quizzes</span></nav>
    <h1 class="page-title" id="page-title">Quizzes · কুইজ</h1>
    <p class="page-intro bn" id="page-intro">উত্তর দিয়ে mastery বাড়ান। Enter = check/next · 1–4 = অপশন। ভুল হলে Mistake Bank-এ জমা হবে।</p>
    <div class="chip-row stack-actions-scroll" style="margin-bottom:1rem" id="filters"></div>
    <div id="quiz-root"></div>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="../js/storage.js"></script>
  <script src="../js/progress.js"></script>
  <script src="../js/quiz-engine.js"></script>
  <script src="../js/review-session.js"></script>
  <script src="../js/app.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    let skill = params.get("skill") || "all";
    const itemId = params.get("item_id");
    const mode = params.get("mode"); // review | mistakes | weak

    function startSkill(all, fresh) {
      let filtered = skill === "all" ? all : all.filter((q) => q.skill === skill);
      if (itemId) {
        filtered = filtered.filter((q) => q.item_id === itemId);
        document.getElementById("page-title").textContent = "Topic Quiz · টপিক কুইজ";
        document.getElementById("page-intro").textContent =
          filtered.length
            ? "এই টপিকের প্রশ্ন — ভুল হলে Mistake Bank-এ জমা হবে।"
            : "এই টপিকের জন্য এখনো আলাদা প্রশ্ন নেই — সব Grammar Quiz দিয়ে শুরু করুন।";
      }
      if (itemId && !filtered.length) {
        document.getElementById("quiz-root").innerHTML = `
          <div class="empty-state bn">
            এই টপিকের নিবেদিত কুইজ এখনো নেই।
            <div class="stack-actions" style="margin-top:1rem;justify-content:center">
              <a class="btn btn-primary" href="quizzes.html?skill=grammar">Grammar Quizzes</a>
              <a class="btn btn-secondary" href="grammar.html">← Grammar</a>
            </div>
          </div>`;
        return;
      }
      const skillKey = skill === "all" ? "quizzes" : skill;
      EFBQuiz.mount(document.getElementById("quiz-root"), {
        questions: filtered,
        skill: skillKey,
        itemId: itemId || null,
        mode: null,
        resumeSkill: "quiz",
        sessionTag: ["skill", skillKey, itemId || ""].join("|"),
        label: itemId ? "Topic quiz" : "Quiz · " + skillKey,
        resumeHref:
          "quizzes.html?resume=1" +
          (skill === "all" ? "" : "&skill=" + encodeURIComponent(skill)) +
          (itemId ? "&item_id=" + encodeURIComponent(itemId) : ""),
        profileSkill: skillKey,
        limit: itemId ? Math.min(10, Math.max(filtered.length, 1)) : 10,
        fresh: !!fresh,
      });
    }

    function startMode(all, banks) {
      const session = EFBReview.buildSession({
        mode: mode,
        quizzes: all,
        banks: banks,
        limit: 10,
      });
      document.getElementById("page-title").textContent = session.title + " · " + session.title_bn;
      document.getElementById("page-intro").textContent =
        mode === "mistakes"
          ? "আগের ভুল আইটেমগুলো আবার অনুশীলন করুন। সঠিক উত্তর দিলে Mistake Bank থেকে সরে যাবে।"
          : mode === "weak"
            ? "যে আইটেমগুলোতে বেশি ভুল বা কম mastery — এক ট্যাপে অনুশীলন।"
            : "আজকের due রিভিউ আইটেম। SRS অনুযায়ী আজ পুনরাবৃত্তি দরকার।";
      document.getElementById("filters").innerHTML = `
        <a class="chip-btn" href="my-progress.html">← Progress</a>
        <a class="chip-btn" href="quizzes.html">সব কুইজ</a>
        <span class="chip">${session.questions.length} items</span>
      `;
      if (!session.questions.length) {
        document.getElementById("quiz-root").innerHTML = `
          <div class="empty-state bn">
            ${
              mode === "mistakes"
                ? "Mistake Bank খালি — আগে কুইজ দিয়ে ভুল জমান।"
                : mode === "weak"
                  ? "এখনো যথেষ্ট weak-area ডেটা নেই — কয়েকটা কুইজ দিন।"
                  : "আজ রিভিউ নেই। নতুন অনুশীলন করুন।"
            }
            <div class="stack-actions" style="margin-top:1rem;justify-content:center">
              <a class="btn btn-primary" href="quizzes.html">Quizzes</a>
              <a class="btn btn-secondary" href="daily-challenge.html">Daily Challenge</a>
            </div>
          </div>`;
        return;
      }
      const resumeSkill = mode === "mistakes" ? "mistakes" : mode === "weak" ? "weak" : "review";
      EFBQuiz.mount(document.getElementById("quiz-root"), {
        questions: session.questions,
        skill: resumeSkill,
        mode: mode,
        resumeSkill: resumeSkill,
        sessionTag: ["mode", mode].join("|"),
        label: session.title,
        resumeHref: "quizzes.html?mode=" + mode + "&resume=1",
        profileSkill: resumeSkill,
        limit: 10,
        onComplete: function () {},
      });
    }

    Promise.all([
      EFBApp.loadJSON("quizzes.json"),
      EFBApp.loadJSON("vocabulary.json"),
      EFBApp.loadJSON("phrasal-verbs.json"),
      EFBApp.loadJSON("spelling.json"),
      EFBApp.loadJSON("grammar.json"),
      EFBApp.loadJSON("common-mistakes.json"),
    ]).then(([all, vocab, phrasal, spelling, grammar, mistakes]) => {
      if (mode === "review" || mode === "mistakes" || mode === "weak") {
        startMode(all, { vocab: vocab, phrasal: phrasal, spelling: spelling, grammar: grammar, mistakes: mistakes });
        return;
      }

      const skills = ["all", "vocabulary", "grammar", "phrasal", "spelling", "mistakes", "translate"];
      document.getElementById("filters").innerHTML =
        skills
          .map(
            (s) =>
              `<button type="button" class="chip-btn ${s === skill ? "is-active" : ""}" data-s="${s}">${s}</button>`
          )
          .join("") +
        (itemId
          ? `<a class="chip-btn" href="grammar.html#${encodeURIComponent(itemId)}">← Grammar</a>`
          : "") +
        `<a class="chip-btn" href="quizzes.html?mode=review">Review due</a>` +
        `<a class="chip-btn" href="quizzes.html?mode=weak">Weak areas</a>` +
        `<a class="chip-btn" href="quizzes.html?mode=mistakes">Mistake Bank</a>`;
      document.getElementById("filters").addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-s]");
        if (!btn) return;
        skill = btn.getAttribute("data-s");
        history.replaceState(null, "", skill === "all" ? "quizzes.html" : "quizzes.html?skill=" + skill);
        if (window.EFBProgress) EFBProgress.clearResume("quiz");
        startSkill(all, true);
        [...document.querySelectorAll("#filters button[data-s]")].forEach((b) => {
          b.className = "chip-btn" + (b.getAttribute("data-s") === skill ? " is-active" : "");
        });
      });
      startSkill(all, false);
    });
  </script>
</body>
</html>
