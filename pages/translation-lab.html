<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f6b5c" />
  <title>Translation Lab — English for Bengalis</title>
  <meta name="description" content="Bangla to English typing drills for Bengali speakers: fix direct-translation mistakes, articles, prepositions and phrasals." />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;700&family=Noto+Sans+Bengali:wght@400;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/learning.css" />
</head>
<body data-root="..">
  <header class="site-header" id="site-header"></header>
  <div class="nav-drawer" id="nav-drawer"></div>
  <main class="wrap">
    <nav class="breadcrumb"><a href="../index.html">Home</a> › <a href="practice.html">Practice</a> › <span>Translation Lab</span></nav>
    <h1 class="page-title">Translation Lab · অনুবাদ ল্যাব</h1>
    <p class="page-intro bn">বাংলা দেখে ইংরেজি লিখুন। সরাসরি অনুবাদের ভুল ভাঙতে সাহায্য করে — মাঝপথে বন্ধ করলেও চালিয়ে যেতে পারবেন।</p>
    <div class="stack-actions" style="margin-bottom:1rem" id="topic-filters"></div>
    <div id="quiz-root"></div>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="../js/storage.js"></script>
  <script src="../js/progress.js"></script>
  <script src="../js/quiz-engine.js"></script>
  <script src="../js/app.js"></script>
  <script>
    let allItems = [];
    let topic = "all";

    function start(fresh) {
      const filtered = topic === "all" ? allItems : allItems.filter((x) => x.topic === topic);
      const questions = filtered.map((x) => ({
        id: x.id,
        type: x.type || "type",
        skill: "translate",
        item_id: x.item_id || x.id,
        question: x.question,
        question_bn: x.question_bn || "ইংরেজিতে লিখুন:",
        answer: x.answer,
        answers: x.answers || [x.answer],
        explanation: x.explanation || "",
      }));
      EFBQuiz.mount(document.getElementById("quiz-root"), {
        questions: questions,
        skill: "translate",
        topic: topic,
        resumeSkill: "translate",
        sessionTag: "translate|" + topic,
        label: "Translation · " + topic,
        resumeHref: "translation-lab.html?resume=1",
        profileSkill: "translate",
        lessonId: "translation-lab",
        limit: Math.min(10, Math.max(questions.length, 1)),
        fresh: !!fresh,
      });
    }

    EFBApp.loadJSON("translation-lab.json").then((items) => {
      allItems = Array.isArray(items) ? items : [];
      if (window.EFBProgress) EFBProgress.setLastLesson("translate", "translation-lab");
      const topics = ["all"].concat(
        Array.from(new Set(allItems.map((x) => x.topic).filter(Boolean))).sort()
      );
      const saved = EFBProgress.getResume("translate");
      if (saved && saved.topic && topics.indexOf(saved.topic) >= 0) topic = saved.topic;
      document.getElementById("topic-filters").innerHTML = topics
        .map(
          (t) =>
            `<button type="button" class="btn ${t === topic ? "btn-primary" : "btn-secondary"}" data-topic="${t}">${t}</button>`
        )
        .join("");
      document.getElementById("topic-filters").addEventListener("click", (e) => {
        const btn = e.target.closest("[data-topic]");
        if (!btn) return;
        topic = btn.getAttribute("data-topic");
        if (window.EFBProgress) EFBProgress.clearResume("translate");
        [...document.querySelectorAll("#topic-filters .btn")].forEach((b) => {
          b.className = "btn " + (b.getAttribute("data-topic") === topic ? "btn-primary" : "btn-secondary");
        });
        start(true);
      });
      start(false);
    }).catch((err) => {
      document.getElementById("quiz-root").innerHTML =
        `<div class="empty-state bn">Translation Lab লোড হয়নি। পরে আবার চেষ্টা করুন।</div>`;
    });
  </script>
</body>
</html>
