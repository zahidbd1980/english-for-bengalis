<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Vocabulary — English for Bengalis</title>
  <meta name="description" content="Category vocabulary for Bengali learners: office, home, nature, verbs. Pronunciation, synonyms, antonyms, target lists, custom upload." />
  <meta name="theme-color" content="#217a66" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;700&family=Noto+Sans+Bengali:wght@400;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/learning.css" />
</head>
<body data-root=".." class="app-body">
  <a class="skip-link" href="#main">Skip</a>
  <header class="site-header" id="site-header"></header>
  <div class="nav-drawer" id="nav-drawer"></div>
  <main id="main" class="wrap wrap-app">
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <a href="../index.html">Home</a> › <a href="learn.html">Learn</a> › <span>Vocabulary</span>
    </nav>
    <h1 class="page-title">Vocabulary · শব্দভাণ্ডার</h1>
    <p class="page-intro bn">একটা শব্দ করে শিখুন — Previous / Next দিয়ে এগোবেন। ব্রাউজার বন্ধ করলেও পরের দিন একই জায়গা থেকে চলবে। সেটআপ চাইলে নিচে খুলুন।</p>

    <div class="stack-actions stack-actions-scroll" style="margin-bottom:0.85rem">
      <a class="btn btn-primary" href="quizzes.html?skill=vocabulary">Quiz</a>
      <a class="btn btn-secondary" href="flashcards.html?skill=vocabulary">Flashcards</a>
      <button type="button" class="btn btn-secondary" id="btn-study-filtered">এই সেট → Cards</button>
    </div>

    <div id="app" class="vocab-shell"></div>
  </main>
  <footer class="site-footer" id="site-footer"></footer>

  <script src="../js/storage.js"></script>
  <script src="../js/progress.js"></script>
  <script src="../js/vocabulary.js"></script>
  <script src="../js/app.js"></script>
  <script>
    (function () {
      const root = document.getElementById("app");
      let bank = [];
      let listsMeta = { categories: [], lists: [] };
      let savedLists = EFBVocab.loadSavedLists();

      let activeListId = null;
      let activeSavedId = null;
      let category = "all";
      let pos = "all";
      let level = "all";
      let q = "";
      let useCustom = false;
      let customText = "";
      let customWords = [];
      let lang = "en-GB";
      let pageIndex = 0;
      let setupOpen = false;
      let filterKey = "";
      let pendingRestore = null; // { page_index, word_id, order_ids } applied once on next syncPage
      let showResumeHint = false;
      let orderIds = null; // shuffled word id order for current filter (null = bank order)

      if (window.speechSynthesis) {
        speechSynthesis.getVoices();
        speechSynthesis.onvoiceschanged = function () {
          speechSynthesis.getVoices();
        };
      }

      function shuffleArr(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const t = a[i];
          a[i] = a[j];
          a[j] = t;
        }
        return a;
      }

      function baseWords() {
        if (activeSavedId) {
          const s = savedLists.find((x) => x.id === activeSavedId);
          return EFBVocab.resolveCustomWords((s && s.words) || [], bank);
        }
        let wordIds = null;
        if (activeListId) {
          const L = listsMeta.lists.find((x) => x.id === activeListId);
          wordIds = (L && L.word_ids) || [];
        }
        let words = EFBVocab.filterWords(bank, {
          wordIds: wordIds,
          category: activeListId ? "all" : category,
          pos: pos,
          level: level,
          q: q,
        });
        if (useCustom && customWords.length) {
          const extra = EFBVocab.resolveCustomWords(customWords, bank);
          const seen = new Set(words.map((w) => EFBVocab.normalizeWord(w.word)));
          extra.forEach((w) => {
            const n = EFBVocab.normalizeWord(w.word);
            if (!seen.has(n)) {
              seen.add(n);
              words.push(w);
            }
          });
        }
        return words;
      }

      function currentWords() {
        const words = baseWords();
        if (!orderIds || !orderIds.length || !words.length) return words;
        const byId = {};
        words.forEach((w) => {
          if (w && w.id) byId[w.id] = w;
        });
        const ordered = orderIds.map((id) => byId[id]).filter(Boolean);
        const seen = new Set(ordered.map((w) => w.id));
        words.forEach((w) => {
          if (w && w.id && !seen.has(w.id)) ordered.push(w);
        });
        return ordered.length ? ordered : words;
      }

      function applyShuffle(resetIndex) {
        const words = baseWords();
        orderIds = shuffleArr(words.map((w) => w.id).filter(Boolean));
        if (resetIndex !== false) pageIndex = 0;
        showResumeHint = false;
      }

      function vocabStudyLists() {
        return (listsMeta.lists || []).filter((L) => {
          const ids = L.word_ids || [];
          const lid = String(L.id || "");
          if (lid.startsWith("vf-") || lid === "verb-forms-master") return false;
          return !ids.some((id) => String(id).startsWith("verb:"));
        });
      }

      function pickRandomList() {
        const lists = vocabStudyLists();
        if (!lists.length) {
          alert("এখনো কোনো target list নেই।");
          return;
        }
        const pool = activeListId ? lists.filter((L) => L.id !== activeListId) : lists;
        const pick = (pool.length ? pool : lists)[Math.floor(Math.random() * (pool.length || lists.length))];
        activeSavedId = null;
        activeListId = pick.id;
        category = "all";
        orderIds = null;
        pageIndex = 0;
        showResumeHint = false;
        filterKey = "";
        setupOpen = false;
        applyShuffle(true);
        render();
      }

      function resumeKey() {
        if (activeSavedId) return "saved:" + activeSavedId;
        if (activeListId) return "list:" + activeListId;
        return "filter:" + [category, pos, level, (q || "").trim().toLowerCase()].join("|");
      }

      function indexFromSlot(words, slot) {
        if (!slot || !words.length) return 0;
        if (slot.word_id) {
          const i = words.findIndex((w) => w.id === slot.word_id);
          if (i >= 0) return i;
        }
        const idx = Number(slot.page_index) || 0;
        return Math.max(0, Math.min(words.length - 1, idx));
      }

      function slotForKey(key) {
        if (!window.EFBProgress) return null;
        const r = EFBProgress.getResume("vocabulary");
        if (!r) return null;
        if (r.by_key && r.by_key[key]) return r.by_key[key];
        if (r.last_key === key) return r;
        return null;
      }

      function persistResume(words) {
        if (!window.EFBProgress || !words || !words.length) return;
        const w = words[pageIndex];
        EFBProgress.saveResume("vocabulary", {
          key: resumeKey(),
          page_index: pageIndex,
          word_id: (w && w.id) || null,
          label: activeLabel(),
          total: words.length,
          active_list_id: activeListId,
          active_saved_id: activeSavedId,
          category: category,
          pos: pos,
          level: level,
          q: q,
          lesson_id: activeListId
            ? "list:" + activeListId
            : activeSavedId
              ? "saved:" + activeSavedId
              : "vocab-hub",
          order_ids: orderIds && orderIds.length ? orderIds.slice() : null,
          shuffled: !!(orderIds && orderIds.length),
        });
      }

      function syncPage(words) {
        const key = [activeListId || "", activeSavedId || "", category, pos, level, q, useCustom, customWords.join(",")].join("|");
        if (key !== filterKey) {
          filterKey = key;
          if (pendingRestore) {
            pageIndex = indexFromSlot(words, pendingRestore);
            showResumeHint = pageIndex > 0;
            pendingRestore = null;
          } else {
            const slot = slotForKey(resumeKey());
            if (slot) {
              pageIndex = indexFromSlot(words, slot);
              showResumeHint = pageIndex > 0;
            } else {
              pageIndex = 0;
              showResumeHint = false;
            }
          }
        }
        if (!words.length) pageIndex = 0;
        else if (pageIndex >= words.length) pageIndex = words.length - 1;
        if (pageIndex < 0) pageIndex = 0;
      }

      function prepareOrderForFilter() {
        const key = [activeListId || "", activeSavedId || "", category, pos, level, q, useCustom, customWords.join(",")].join("|");
        if (key === filterKey) return;
        if (pendingRestore) {
          orderIds =
            Array.isArray(pendingRestore.order_ids) && pendingRestore.order_ids.length
              ? pendingRestore.order_ids.slice()
              : null;
          return;
        }
        const slot = slotForKey(resumeKey());
        orderIds =
          slot && Array.isArray(slot.order_ids) && slot.order_ids.length ? slot.order_ids.slice() : null;
      }

      function persistStudySet(words) {
        try {
          const ordered = orderIds && orderIds.length ? words : shuffleArr(words);
          const payload = JSON.stringify(
            ordered.map((w) => ({
              item_id: w.id,
              front: w.word,
              back: w.meaning_en,
              back_bn: w.meaning_bn,
              example: w.example || "",
            }))
          );
          sessionStorage.setItem("efb_vocab_study_set", payload);
          localStorage.setItem("efb_vocab_study_set_v1", payload);
        } catch (e) {}
      }

      function activeLabel() {
        if (activeSavedId) {
          const s = savedLists.find((x) => x.id === activeSavedId);
          return (s && s.title) || "My List";
        }
        if (activeListId) {
          const L = listsMeta.lists.find((x) => x.id === activeListId);
          return (L && L.title) || "Target list";
        }
        if (category !== "all") return category;
        return "All words";
      }

      function render() {
        prepareOrderForFilter();
        const words = currentWords();
        syncPage(words);
        const w = words[pageIndex];
        if (w && w.id && window.EFBProgress) EFBProgress.markSeen(w.id);

        const catBtns = (listsMeta.categories || [])
          .map((c) => {
            const active = !activeListId && !activeSavedId && category === c.id;
            return `<button type="button" class="chip-btn ${active ? "is-active" : ""}" data-cat="${EFBVocab.esc(c.id)}">${EFBVocab.esc(c.label)}</button>`;
          })
          .join("");

        const listCards = vocabStudyLists()
          .map((L) => {
            const on = activeListId === L.id && !activeSavedId;
            return `<label class="vocab-list-card ${on ? "is-active" : ""}">
              <input type="radio" name="target-list" value="${EFBVocab.esc(L.id)}" ${on ? "checked" : ""} />
              <strong>${EFBVocab.esc(L.title)}</strong>
              <span class="bn muted">${EFBVocab.esc(L.title_bn)}</span>
              <span class="muted">${(L.word_ids || []).length} words</span>
            </label>`;
          })
          .join("");

        const savedCards = savedLists.length
          ? savedLists
              .map(
                (s) => `<div class="vocab-list-card ${activeSavedId === s.id ? "is-active" : ""}">
              <strong>${EFBVocab.esc(s.title)}</strong>
              <span class="muted">${(s.words || []).length} words</span>
              <div class="stack-actions" style="margin-top:0.5rem">
                <button type="button" class="btn btn-secondary btn-use-saved" data-id="${EFBVocab.esc(s.id)}">Open</button>
                <button type="button" class="btn btn-ghost btn-del-saved" data-id="${EFBVocab.esc(s.id)}">Delete</button>
              </div>
            </div>`
              )
              .join("")
          : `<p class="muted bn">এখনো My List নেই।</p>`;

        const pct = words.length ? Math.round(((pageIndex + 1) / words.length) * 100) : 0;
        const cardBlock = w
          ? EFBVocab.cardHTML(w)
          : `<div class="empty-state bn">কোনো শব্দ মেলেনি — সেটআপ থেকে ফিল্টার বদলান।</div>`;
        const resumeBanner =
          showResumeHint && pageIndex > 0
            ? `<div class="vocab-resume-banner bn" role="status">
                যেখানে থেমেছিলেন সেখান থেকে চলছে · <strong>${pageIndex + 1}</strong> / ${words.length}
                <button type="button" class="btn btn-ghost" id="btn-restart-list">১ নম্বর থেকে শুরু</button>
              </div>`
            : "";

        const shuffled = !!(orderIds && orderIds.length);
        root.innerHTML = `
          <section class="vocab-study panel highlight">
            <div class="vocab-study-top">
              <span class="chip">${EFBVocab.esc(activeLabel())}${shuffled ? " · random" : ""}</span>
              <span class="chip">${words.length ? pageIndex + 1 : 0} / ${words.length}</span>
            </div>
            <div class="stack-actions stack-actions-scroll" style="margin:0">
              <button type="button" class="btn btn-secondary" id="btn-shuffle-words">Shuffle · এলোমেলো</button>
              <button type="button" class="btn btn-secondary" id="btn-random-list">Random list</button>
              ${
                shuffled
                  ? `<button type="button" class="btn btn-ghost" id="btn-order-reset">লিস্ট অর্ডার</button>`
                  : ""
              }
            </div>
            ${resumeBanner}
            <div class="bar" data-pct="${pct}" aria-hidden="true"><i style="width:${pct}%"></i></div>
            <div id="vocab-card-stage" class="vocab-card-stage">${cardBlock}</div>
            <div class="vocab-pager" role="group" aria-label="Word navigation">
              <button type="button" class="btn btn-secondary" id="btn-prev" ${pageIndex <= 0 ? "disabled" : ""}>‹ Previous</button>
              <button type="button" class="btn btn-primary" id="btn-next" ${!words.length || pageIndex >= words.length - 1 ? "disabled" : ""}>Next ›</button>
            </div>
            <p class="muted bn vocab-pager-hint">সোয়াইপ বা ← → কীবোর্ডও চলে · প্রোগ্রেস অটো সেভ</p>
          </section>

          <details class="panel vocab-setup" id="setup-panel" ${setupOpen ? "open" : ""}>
            <summary class="vocab-setup-summary">
              <span>সেটআপ · Lists / Filter / Custom</span>
              <span class="muted">ট্যাপ করে খুলুন</span>
            </summary>
            <div class="vocab-setup-body">
              <h2 class="section-title">Target lists</h2>
              <div class="stack-actions" style="margin:0 0 0.75rem">
                <button type="button" class="btn btn-accent" id="btn-random-list-setup">Random list · সারপ্রাইজ</button>
              </div>
              <div class="vocab-list-grid">${listCards}
                <label class="vocab-list-card ${!activeListId && !activeSavedId ? "is-active" : ""}">
                  <input type="radio" name="target-list" value="" ${!activeListId && !activeSavedId ? "checked" : ""} />
                  <strong>Browse by filters</strong>
                  <span class="bn muted">ক্যাটাগরি দিয়ে</span>
                </label>
              </div>

              <h2 class="section-title">Category & filters</h2>
              <div class="chip-row" id="cat-row">${catBtns}</div>
              <div class="vocab-filters">
                <label class="field">Part of speech
                  <select id="pos" class="field-input">
                    <option value="all">All</option>
                    <option value="verb">Verb</option>
                    <option value="noun">Noun</option>
                    <option value="adjective">Adjective</option>
                    <option value="adverb">Adverb</option>
                  </select>
                </label>
                <label class="field">CEFR
                  <select id="level" class="field-input">
                    <option value="all">All</option>
                    <option value="A1">A1</option>
                    <option value="A2">A2</option>
                    <option value="B1">B1</option>
                  </select>
                </label>
                <label class="field bn">খুঁজুন
                  <input id="search" class="field-input" type="search" placeholder="word / অর্থ" value="${EFBVocab.esc(q)}" />
                </label>
                <label class="field">TTS
                  <select id="lang" class="field-input">
                    <option value="en-GB">British</option>
                    <option value="en-US">American</option>
                  </select>
                </label>
              </div>

              <h2 class="section-title">Custom list</h2>
              <label class="field check-row">
                <input type="checkbox" id="use-custom" ${useCustom ? "checked" : ""} />
                <span class="bn">কাস্টম ওয়ার্ড যোগ করুন</span>
              </label>
              <div id="custom-box" class="${useCustom ? "" : "hidden"}">
                <label class="field bn" for="custom-text">প্রতি লাইনে একটি শব্দ
                  <textarea id="custom-text" class="type-input" rows="4" placeholder="deadline&#10;colleague">${EFBVocab.esc(customText)}</textarea>
                </label>
                <div class="stack-actions">
                  <label class="btn btn-secondary" style="cursor:pointer">Upload .txt
                    <input type="file" id="file-upload" accept=".txt,text/plain" hidden />
                  </label>
                  <button type="button" class="btn btn-primary" id="btn-apply-custom">Apply</button>
                  <button type="button" class="btn btn-ghost" id="btn-save-my-list">Save My List</button>
                </div>
              </div>
              <h3 class="section-title" style="font-size:1.05rem">My Lists</h3>
              <div class="vocab-list-grid">${savedCards}</div>
            </div>
          </details>
        `;

        root.querySelector("#pos").value = pos;
        root.querySelector("#level").value = level;
        root.querySelector("#lang").value = lang;
        bind(words);
        persistResume(words);
      }

      function go(delta, words) {
        const list = words || currentWords();
        if (!list.length) return;
        pageIndex = Math.max(0, Math.min(list.length - 1, pageIndex + delta));
        showResumeHint = false;
        render();
        const stage = document.getElementById("vocab-card-stage");
        if (stage) stage.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }

      function bind(words) {
        const setup = root.querySelector("#setup-panel");
        if (setup) {
          setup.addEventListener("toggle", () => {
            setupOpen = setup.open;
          });
        }

        root.querySelector("#btn-prev").addEventListener("click", () => go(-1, words));
        root.querySelector("#btn-next").addEventListener("click", () => go(1, words));

        const restartBtn = root.querySelector("#btn-restart-list");
        if (restartBtn) {
          restartBtn.addEventListener("click", () => {
            if (window.EFBProgress) EFBProgress.clearResume("vocabulary", resumeKey());
            pageIndex = 0;
            showResumeHint = false;
            filterKey = "";
            render();
            persistResume(currentWords());
          });
        }

        const shuffleBtn = root.querySelector("#btn-shuffle-words");
        if (shuffleBtn) {
          shuffleBtn.addEventListener("click", () => {
            applyShuffle(true);
            filterKey = [activeListId || "", activeSavedId || "", category, pos, level, q, useCustom, customWords.join(",")].join("|");
            render();
          });
        }
        const orderReset = root.querySelector("#btn-order-reset");
        if (orderReset) {
          orderReset.addEventListener("click", () => {
            orderIds = null;
            pageIndex = 0;
            showResumeHint = false;
            filterKey = [activeListId || "", activeSavedId || "", category, pos, level, q, useCustom, customWords.join(",")].join("|");
            render();
          });
        }
        const randList = root.querySelector("#btn-random-list");
        if (randList) randList.addEventListener("click", pickRandomList);
        const randListSetup = root.querySelector("#btn-random-list-setup");
        if (randListSetup) randListSetup.addEventListener("click", pickRandomList);

        root.querySelectorAll('input[name="target-list"]').forEach((el) => {
          el.addEventListener("change", () => {
            activeSavedId = null;
            activeListId = el.value || null;
            if (activeListId) category = "all";
            orderIds = null;
            setupOpen = false;
            render();
          });
        });

        root.querySelector("#cat-row").addEventListener("click", (e) => {
          const btn = e.target.closest("[data-cat]");
          if (!btn) return;
          activeListId = null;
          activeSavedId = null;
          category = btn.getAttribute("data-cat");
          orderIds = null;
          setupOpen = false;
          render();
        });

        root.querySelector("#pos").addEventListener("change", (e) => {
          pos = e.target.value;
          render();
        });
        root.querySelector("#level").addEventListener("change", (e) => {
          level = e.target.value;
          render();
        });
        root.querySelector("#lang").addEventListener("change", (e) => {
          lang = e.target.value;
        });

        let searchTimer = null;
        const search = root.querySelector("#search");
        search.addEventListener("input", (e) => {
          clearTimeout(searchTimer);
          searchTimer = setTimeout(() => {
            q = e.target.value;
            const wasOpen = setupOpen;
            setupOpen = true;
            render();
            const s = root.querySelector("#search");
            if (s) {
              s.focus();
              try {
                s.setSelectionRange(s.value.length, s.value.length);
              } catch (err) {}
            }
            setupOpen = wasOpen;
          }, 220);
        });

        root.querySelector("#use-custom").addEventListener("change", (e) => {
          useCustom = e.target.checked;
          setupOpen = true;
          render();
        });

        const applyCustom = () => {
          const ta = root.querySelector("#custom-text");
          customText = ta ? ta.value : customText;
          customWords = EFBVocab.parseCustomText(customText);
          useCustom = true;
          render();
        };
        const applyBtn = root.querySelector("#btn-apply-custom");
        if (applyBtn) applyBtn.addEventListener("click", applyCustom);

        const file = root.querySelector("#file-upload");
        if (file) {
          file.addEventListener("change", () => {
            const f = file.files && file.files[0];
            if (!f) return;
            const reader = new FileReader();
            reader.onload = () => {
              customText = String(reader.result || "");
              customWords = EFBVocab.parseCustomText(customText);
              useCustom = true;
              setupOpen = true;
              render();
            };
            reader.readAsText(f);
          });
        }

        const saveBtn = root.querySelector("#btn-save-my-list");
        if (saveBtn) {
          saveBtn.addEventListener("click", () => {
            applyCustom();
            if (!customWords.length) {
              alert("আগে কিছু শব্দ পেস্ট/আপলোড করুন।");
              return;
            }
            const title = prompt("My List-এর নাম:", "My Vocab " + (savedLists.length + 1));
            if (!title) return;
            const item = {
              id: "saved-" + Date.now(),
              title: title.trim(),
              words: customWords.slice(),
              created_at: new Date().toISOString(),
            };
            savedLists.unshift(item);
            EFBVocab.saveSavedLists(savedLists);
            activeSavedId = item.id;
            activeListId = null;
            setupOpen = false;
            render();
          });
        }

        root.querySelectorAll(".btn-use-saved").forEach((btn) => {
          btn.addEventListener("click", () => {
            activeSavedId = btn.getAttribute("data-id");
            activeListId = null;
            setupOpen = false;
            render();
          });
        });
        root.querySelectorAll(".btn-del-saved").forEach((btn) => {
          btn.addEventListener("click", () => {
            const id = btn.getAttribute("data-id");
            if (!confirm("Delete this My List?")) return;
            savedLists = savedLists.filter((x) => x.id !== id);
            EFBVocab.saveSavedLists(savedLists);
            if (activeSavedId === id) activeSavedId = null;
            setupOpen = true;
            render();
          });
        });

        root.querySelectorAll(".btn-speak, .btn-speak-slow").forEach((btn) => {
          btn.addEventListener("click", () => {
            EFBVocab.speak(btn.getAttribute("data-speak"), {
              lang: lang,
              slow: btn.getAttribute("data-slow") === "1",
            });
          });
        });

        // Swipe on card stage
        const stage = root.querySelector("#vocab-card-stage");
        if (stage) {
          let x0 = null;
          stage.addEventListener(
            "touchstart",
            (e) => {
              x0 = e.changedTouches[0].screenX;
            },
            { passive: true }
          );
          stage.addEventListener(
            "touchend",
            (e) => {
              if (x0 == null) return;
              const dx = e.changedTouches[0].screenX - x0;
              x0 = null;
              if (Math.abs(dx) < 50) return;
              if (dx < 0) go(1, words);
              else go(-1, words);
            },
            { passive: true }
          );
        }
      }

      document.addEventListener("keydown", (e) => {
        if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
        if (e.target && /BUTTON|A/.test(e.target.tagName) && (e.key === "Enter" || e.key === " ")) return;
        if (e.key === "ArrowRight") {
          e.preventDefault();
          go(1);
        } else if (e.key === "ArrowLeft") {
          e.preventDefault();
          go(-1);
        } else if (e.key === " " || e.key === "s" || e.key === "S") {
          const speakBtn = root.querySelector(".btn-speak, .btn-speak-inline, [data-speak]");
          if (speakBtn) {
            e.preventDefault();
            speakBtn.click();
          }
        } else if (e.key === "Escape") {
          const setup = root.querySelector("#setup-panel");
          if (setup && setup.open) {
            e.preventDefault();
            setup.open = false;
            setupOpen = false;
          }
        }
      });

      document.getElementById("btn-study-filtered").addEventListener("click", () => {
        const words = currentWords();
        if (!words.length) {
          alert("কোনো শব্দ নেই।");
          return;
        }
        persistStudySet(words);
        location.href = "flashcards.html?skill=vocabulary&from=filter";
      });

      function applySavedSession() {
        if (!window.EFBProgress) return;
        const params = new URLSearchParams(location.search || "");
        if (params.get("restart") === "1") {
          EFBProgress.clearResume("vocabulary");
          return;
        }
        const r = EFBProgress.getResume("vocabulary");
        if (!r) return;

        if (r.active_saved_id && savedLists.some((s) => s.id === r.active_saved_id)) {
          activeSavedId = r.active_saved_id;
          activeListId = null;
        } else if (r.active_list_id && (listsMeta.lists || []).some((L) => L.id === r.active_list_id)) {
          activeListId = r.active_list_id;
          activeSavedId = null;
          category = "all";
        } else if (!r.active_list_id && !r.active_saved_id) {
          category = r.category || "all";
          pos = r.pos || "all";
          level = r.level || "all";
          q = r.q || "";
        }

        const key = resumeKey();
        const slot = (r.by_key && r.by_key[key]) || null;
        pendingRestore = slot
          ? {
              page_index: slot.page_index,
              word_id: slot.word_id,
              order_ids: slot.order_ids || r.order_ids || null,
            }
          : {
              page_index: r.page_index,
              word_id: r.word_id,
              order_ids: r.order_ids || null,
            };
      }

      Promise.all([EFBApp.loadJSON("vocabulary.json"), EFBApp.loadJSON("vocabulary-lists.json")])
        .then(([words, meta]) => {
          bank = EFBVocab.asWords(words);
          listsMeta = meta || { categories: [], lists: [] };
          applySavedSession();
          render();
        })
        .catch((e) => {
          root.innerHTML = `<div class="empty-state">Could not load vocabulary: ${EFBVocab.esc(e.message)}</div>`;
        });
    })();
  </script>
</body>
</html>
