<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vocabulary — English for Bengalis</title>
  <meta name="description" content="Category vocabulary for Bengali learners: office, home, nature, verbs. Pronunciation, synonyms, antonyms, target lists, custom upload." />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;700&family=Noto+Sans+Bengali:wght@400;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/learning.css" />
</head>
<body data-root="..">
  <a class="skip-link" href="#main">Skip</a>
  <header class="site-header" id="site-header"></header>
  <div class="nav-drawer" id="nav-drawer"></div>
  <main id="main" class="wrap">
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <a href="../index.html">Home</a> › <a href="learn.html">Learn</a> › <span>Vocabulary</span>
    </nav>
    <h1 class="page-title">Vocabulary · শব্দভাণ্ডার</h1>
    <p class="page-intro bn">টার্গেট লিস্ট বেছে নিন বা ক্যাটাগরি ফিল্টার করুন। উচ্চারণ শুনুন, similar/opposite দেখুন, কাস্টম লিস্ট আপলোড করে নিজের সেট বানান।</p>

    <div class="stack-actions" style="margin-bottom:1rem">
      <a class="btn btn-primary" id="quiz-link" href="quizzes.html?skill=vocabulary">Vocabulary Quiz</a>
      <a class="btn btn-secondary" id="flash-link" href="flashcards.html?skill=vocabulary">Flashcards</a>
      <button type="button" class="btn btn-ghost" id="btn-study-filtered">এই ফিল্টার দিয়ে Flashcards</button>
    </div>

    <div id="app" class="vocab-shell"></div>
  </main>
  <footer class="site-footer" id="site-footer"></footer>

  <script src="../js/storage.js"></script>
  <script src="../js/progress.js"></script>
  <script src="../js/vocabulary.js"></script>
  <script src="../js/app.js"></script>
  <script>
    (function () {
      const root = document.getElementById("app");
      let bank = [];
      let listsMeta = { categories: [], lists: [] };
      let savedLists = EFBVocab.loadSavedLists();

      let activeListId = null; // preset or saved:
      let activeSavedId = null;
      let category = "all";
      let pos = "all";
      let level = "all";
      let q = "";
      let useCustom = false;
      let customText = "";
      let customWords = [];
      let slowDefault = false;
      let lang = "en-GB";

      if (window.speechSynthesis) {
        speechSynthesis.getVoices();
        speechSynthesis.onvoiceschanged = function () {
          speechSynthesis.getVoices();
        };
      }

      function currentWords() {
        if (activeSavedId) {
          const s = savedLists.find((x) => x.id === activeSavedId);
          return EFBVocab.resolveCustomWords((s && s.words) || [], bank);
        }
        let wordIds = null;
        if (activeListId) {
          const L = listsMeta.lists.find((x) => x.id === activeListId);
          wordIds = (L && L.word_ids) || [];
        }
        let words = EFBVocab.filterWords(bank, {
          wordIds: wordIds,
          category: activeListId ? "all" : category,
          pos: pos,
          level: level,
          q: q,
        });
        if (useCustom && customWords.length) {
          const extra = EFBVocab.resolveCustomWords(customWords, bank);
          const seen = new Set(words.map((w) => EFBVocab.normalizeWord(w.word)));
          extra.forEach((w) => {
            const n = EFBVocab.normalizeWord(w.word);
            if (!seen.has(n)) {
              seen.add(n);
              words.push(w);
            }
          });
        }
        return words;
      }

      function persistStudySet(words) {
        try {
          sessionStorage.setItem(
            "efb_vocab_study_set",
            JSON.stringify(
              words.map((w) => ({
                item_id: w.id,
                front: w.word,
                back: w.meaning_en,
                back_bn: w.meaning_bn,
                example: w.example || "",
              }))
            )
          );
        } catch (e) {}
      }

      function render() {
        const words = currentWords();
        words.forEach((w) => {
          if (w.id && window.EFBProgress) EFBProgress.markSeen(w.id);
        });

        const catBtns = (listsMeta.categories || [])
          .map((c) => {
            const active = !activeListId && !activeSavedId && category === c.id;
            return `<button type="button" class="chip-btn ${active ? "is-active" : ""}" data-cat="${EFBVocab.esc(c.id)}">${EFBVocab.esc(c.label)} <span class="bn">· ${EFBVocab.esc(c.label_bn)}</span></button>`;
          })
          .join("");

        const listCards = (listsMeta.lists || [])
          .map((L) => {
            const on = activeListId === L.id && !activeSavedId;
            return `<label class="vocab-list-card ${on ? "is-active" : ""}">
              <input type="radio" name="target-list" value="${EFBVocab.esc(L.id)}" ${on ? "checked" : ""} />
              <strong>${EFBVocab.esc(L.title)}</strong>
              <span class="bn muted">${EFBVocab.esc(L.title_bn)}</span>
              <span class="muted">${(L.word_ids || []).length} words · ${EFBVocab.esc(L.description_bn || L.description || "")}</span>
            </label>`;
          })
          .join("");

        const savedCards = savedLists.length
          ? savedLists
              .map(
                (s) => `<div class="vocab-list-card ${activeSavedId === s.id ? "is-active" : ""}" data-saved="${EFBVocab.esc(s.id)}">
              <strong>${EFBVocab.esc(s.title)}</strong>
              <span class="muted">${(s.words || []).length} words</span>
              <div class="stack-actions" style="margin-top:0.5rem">
                <button type="button" class="btn btn-secondary btn-use-saved" data-id="${EFBVocab.esc(s.id)}">Open</button>
                <button type="button" class="btn btn-ghost btn-del-saved" data-id="${EFBVocab.esc(s.id)}">Delete</button>
              </div>
            </div>`
              )
              .join("")
          : `<p class="muted bn">এখনো সেভ করা My List নেই।</p>`;

        root.innerHTML = `
          <section class="panel vocab-panel">
            <h2 class="section-title">১) Target Vocabulary Lists</h2>
            <p class="muted bn">টিচার-কিউরেটেড টার্গেট সেট — এক ক্লিকে ফোকাসড স্টাডি।</p>
            <div class="vocab-list-grid">${listCards}
              <label class="vocab-list-card ${!activeListId && !activeSavedId ? "is-active" : ""}">
                <input type="radio" name="target-list" value="" ${!activeListId && !activeSavedId ? "checked" : ""} />
                <strong>Browse by filters</strong>
                <span class="bn muted">ক্যাটাগরি / সার্চ দিয়ে দেখুন</span>
              </label>
            </div>
          </section>

          <section class="panel vocab-panel">
            <h2 class="section-title">২) Category · POS · Level · Search</h2>
            <div class="chip-row" id="cat-row">${catBtns}</div>
            <div class="vocab-filters">
              <label class="field">Part of speech
                <select id="pos" class="field-input">
                  <option value="all">All</option>
                  <option value="verb">Verb</option>
                  <option value="noun">Noun</option>
                  <option value="adjective">Adjective</option>
                  <option value="adverb">Adverb</option>
                </select>
              </label>
              <label class="field">CEFR
                <select id="level" class="field-input">
                  <option value="all">All</option>
                  <option value="A1">A1</option>
                  <option value="A2">A2</option>
                  <option value="B1">B1</option>
                </select>
              </label>
              <label class="field bn">খুঁজুন
                <input id="search" class="field-input" type="search" placeholder="word / অর্থ / synonym" value="${EFBVocab.esc(q)}" />
              </label>
              <label class="field">TTS accent
                <select id="lang" class="field-input">
                  <option value="en-GB">British (en-GB)</option>
                  <option value="en-US">American (en-US)</option>
                </select>
              </label>
            </div>
          </section>

          <section class="panel vocab-panel">
            <h2 class="section-title">৩) Custom list · আপলোড / পেস্ট</h2>
            <label class="field" style="display:flex;gap:0.5rem;align-items:center;font-weight:600">
              <input type="checkbox" id="use-custom" ${useCustom ? "checked" : ""} />
              <span class="bn">কাস্টম ওয়ার্ড বর্তমান ভিউতে যোগ করুন</span>
            </label>
            <div id="custom-box" class="${useCustom ? "" : "hidden"}">
              <label class="field bn" for="custom-text">প্রতি লাইনে একটি শব্দ (বা word — note)
                <textarea id="custom-text" class="type-input" rows="5" style="min-height:110px;resize:vertical" placeholder="deadline&#10;colleague&#10;pollution">${EFBVocab.esc(customText)}</textarea>
              </label>
              <div class="stack-actions">
                <label class="btn btn-secondary" style="cursor:pointer">Upload .txt
                  <input type="file" id="file-upload" accept=".txt,text/plain" hidden />
                </label>
                <button type="button" class="btn btn-primary" id="btn-apply-custom">Apply custom</button>
                <button type="button" class="btn btn-ghost" id="btn-save-my-list">Save as My List</button>
                <span class="muted">${customWords.length} custom words</span>
              </div>
            </div>
            <h3 class="section-title" style="font-size:1.1rem;margin-top:1.25rem">My Lists</h3>
            <div class="vocab-list-grid">${savedCards}</div>
          </section>

          <section class="vocab-results">
            <div class="quiz-meta" style="margin-bottom:0.75rem">
              <span class="chip">${words.length} words</span>
              <span class="muted bn">প্রতিটি কার্ডে 🔊 উচ্চারণ · Similar · Opposite</span>
            </div>
            <div id="list" class="lesson-block">${words.map(EFBVocab.cardHTML).join("") || '<div class="empty-state bn">কোনো শব্দ মেলেনি — ফিল্টার বদলান।</div>'}</div>
          </section>
        `;

        // restore select values
        root.querySelector("#pos").value = pos;
        root.querySelector("#level").value = level;
        root.querySelector("#lang").value = lang;

        bind();
      }

      function bind() {
        root.querySelectorAll('input[name="target-list"]').forEach((el) => {
          el.addEventListener("change", () => {
            activeSavedId = null;
            activeListId = el.value || null;
            if (activeListId) category = "all";
            render();
          });
        });

        root.querySelector("#cat-row").addEventListener("click", (e) => {
          const btn = e.target.closest("[data-cat]");
          if (!btn) return;
          activeListId = null;
          activeSavedId = null;
          category = btn.getAttribute("data-cat");
          render();
        });

        root.querySelector("#pos").addEventListener("change", (e) => {
          pos = e.target.value;
          render();
        });
        root.querySelector("#level").addEventListener("change", (e) => {
          level = e.target.value;
          render();
        });
        root.querySelector("#lang").addEventListener("change", (e) => {
          lang = e.target.value;
        });

        let searchTimer = null;
        root.querySelector("#search").addEventListener("input", (e) => {
          clearTimeout(searchTimer);
          searchTimer = setTimeout(() => {
            q = e.target.value;
            render();
            const s = root.querySelector("#search");
            if (s) {
              s.focus();
              try {
                s.setSelectionRange(s.value.length, s.value.length);
              } catch (err) {}
            }
          }, 220);
        });

        root.querySelector("#use-custom").addEventListener("change", (e) => {
          useCustom = e.target.checked;
          render();
        });

        const applyCustom = () => {
          const ta = root.querySelector("#custom-text");
          customText = ta ? ta.value : customText;
          customWords = EFBVocab.parseCustomText(customText);
          useCustom = true;
          render();
        };
        const applyBtn = root.querySelector("#btn-apply-custom");
        if (applyBtn) applyBtn.addEventListener("click", applyCustom);

        const file = root.querySelector("#file-upload");
        if (file) {
          file.addEventListener("change", () => {
            const f = file.files && file.files[0];
            if (!f) return;
            const reader = new FileReader();
            reader.onload = () => {
              customText = String(reader.result || "");
              customWords = EFBVocab.parseCustomText(customText);
              useCustom = true;
              render();
            };
            reader.readAsText(f);
          });
        }

        const saveBtn = root.querySelector("#btn-save-my-list");
        if (saveBtn) {
          saveBtn.addEventListener("click", () => {
            applyCustom();
            if (!customWords.length) {
              alert("আগে কিছু শব্দ পেস্ট/আপলোড করুন।");
              return;
            }
            const title = prompt("My List-এর নাম দিন:", "My Vocab " + (savedLists.length + 1));
            if (!title) return;
            const item = {
              id: "saved-" + Date.now(),
              title: title.trim(),
              words: customWords.slice(),
              created_at: new Date().toISOString(),
            };
            savedLists.unshift(item);
            EFBVocab.saveSavedLists(savedLists);
            activeSavedId = item.id;
            activeListId = null;
            render();
          });
        }

        root.querySelectorAll(".btn-use-saved").forEach((btn) => {
          btn.addEventListener("click", () => {
            activeSavedId = btn.getAttribute("data-id");
            activeListId = null;
            render();
          });
        });
        root.querySelectorAll(".btn-del-saved").forEach((btn) => {
          btn.addEventListener("click", () => {
            const id = btn.getAttribute("data-id");
            if (!confirm("Delete this My List?")) return;
            savedLists = savedLists.filter((x) => x.id !== id);
            EFBVocab.saveSavedLists(savedLists);
            if (activeSavedId === id) activeSavedId = null;
            render();
          });
        });

        root.querySelectorAll(".btn-speak, .btn-speak-slow").forEach((btn) => {
          btn.addEventListener("click", () => {
            const word = btn.getAttribute("data-speak");
            const slow = btn.getAttribute("data-slow") === "1" || slowDefault;
            EFBVocab.speak(word, { lang: lang, slow: slow });
          });
        });
      }

      document.getElementById("btn-study-filtered").addEventListener("click", () => {
        const words = currentWords();
        if (!words.length) {
          alert("কোনো শব্দ নেই।");
          return;
        }
        persistStudySet(words);
        location.href = "flashcards.html?skill=vocabulary&from=filter";
      });

      Promise.all([EFBApp.loadJSON("vocabulary.json"), EFBApp.loadJSON("vocabulary-lists.json")])
        .then(([words, meta]) => {
          bank = EFBVocab.asWords(words);
          listsMeta = meta || { categories: [], lists: [] };
          EFBProgress.setLastLesson("vocabulary", "vocab-hub");
          render();
        })
        .catch((e) => {
          root.innerHTML = `<div class="empty-state">Could not load vocabulary: ${EFBVocab.esc(e.message)}</div>`;
        });
    })();
  </script>
</body>
</html>
